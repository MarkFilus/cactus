name: gatelint-real-fpga-core

on:
  push:
    branches:
      - work/gatelint-real-proof-20260827
    paths:
      - 'ci/gatelint-fpga/**'
      - '.github/workflows/gatelint-real-fpga-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatelint-real-fpga-core
  cancel-in-progress: true

jobs:
  icebreaker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OSS_CAD_ARCHIVE: oss-cad-suite-linux-x64-20260826.tgz
      OSS_CAD_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-26/oss-cad-suite-linux-x64-20260826.tgz
      OSS_CAD_SHA256: b9c1f7a53a8b144be8ab7f8fd754b98b0d2b1a0b72d39165f7bb2bf104b2b652
    steps:
      - uses: actions/checkout@v4

      - name: cache pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.OSS_CAD_ARCHIVE }}
          key: gatelint-oss-cad-20260826-${{ env.OSS_CAD_SHA256 }}

      - name: download and verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$OSS_CAD_ARCHIVE"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 5 --retry-all-errors --output "$archive" "$OSS_CAD_URL"
          fi
          printf '%s  %s\n' "$OSS_CAD_SHA256" "$archive" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/oss-cad-suite"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          for tool in ghdl iverilog vvp yosys nextpnr-ice40 icetime icepack iceunpack; do
            command -v "$tool"
          done

      - name: run real mixed-language core under 60 seconds
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          root="$GITHUB_WORKSPACE/ci/gatelint-fpga"
          work="$GITHUB_WORKSPACE/test-results/gatelint-real-fpga-core"
          rm -rf "$work"
          mkdir -p "$work"

          cat > "$work/core.sh" <<'CORE'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$1
          work=$2
          yosys_data=$(yosys-config --datdir)

          ghdl --synth --std=08 --out=verilog \
            "$root/rtl/vhdl_counter.vhd" -e vhdl_counter \
            > "$work/vhdl_counter.v" 2> "$work/ghdl.stderr"
          grep -Eq '^[[:space:]]*module[[:space:]]+vhdl_counter' "$work/vhdl_counter.v"

          iverilog -g2012 -s tb -o "$work/behavioral.vvp" \
            "$work/vhdl_counter.v" \
            "$root/rtl/uart_challenge.sv" \
            "$root/rtl/top.v" \
            "$root/sim/tb.sv" \
            > "$work/behavioral-compile.stdout" 2> "$work/behavioral-compile.stderr"
          vvp "$work/behavioral.vvp" \
            > "$work/behavioral.stdout" 2> "$work/behavioral.stderr"
          grep -q GATELINT_SIM_PASS "$work/behavioral.stdout"

          cat > "$work/synth.ys" <<YOSYS
          read_verilog -sv "$work/vhdl_counter.v" "$root/rtl/uart_challenge.sv" "$root/rtl/top.v"
          hierarchy -check -top top
          proc; flatten; opt; check -assert
          write_verilog -noattr "$work/generic-synth.v"
          design -reset
          read_verilog -sv "$work/vhdl_counter.v" "$root/rtl/uart_challenge.sv" "$root/rtl/top.v"
          synth_ice40 -device u -top top -json "$work/ice40-synth.json"
          check -assert
          stat -top top
          YOSYS
          yosys -s "$work/synth.ys" > "$work/yosys.stdout" 2> "$work/yosys.stderr"
          test -s "$work/generic-synth.v"
          test -s "$work/ice40-synth.json"

          python3 - "$work/ice40-synth.json" "$root/constraints/icebreaker.pcf" <<'PY'
          import json, re, sys
          netlist = json.load(open(sys.argv[1], encoding='utf-8'))
          ports = set(netlist['modules']['top']['ports'])
          pcf = {}
          for raw in open(sys.argv[2], encoding='utf-8'):
              line = raw.split('#', 1)[0].strip()
              if not line:
                  continue
              fields = line.split()
              if fields[0] != 'set_io':
                  raise SystemExit(f'unsupported PCF command: {line}')
              positional = [x for x in fields[1:] if not x.startswith('-')]
              if len(positional) < 2:
                  raise SystemExit(f'malformed PCF line: {line}')
              port, pin = positional[-2:]
              if port in pcf:
                  raise SystemExit(f'duplicate PCF port: {port}')
              pcf[port] = pin
          if ports != set(pcf):
              raise SystemExit(f'port/PCF mismatch: ports={sorted(ports)} pcf={sorted(pcf)}')
          if len(set(pcf.values())) != len(pcf):
              raise SystemExit('duplicate physical pin')
          if pcf.get('CLK') != '35' or pcf.get('RX') != '6' or pcf.get('TX') != '9' or pcf.get('LEDR_N') != '11':
              raise SystemExit(f'unexpected iCEBreaker constraints: {pcf}')
          PY

          iverilog -g2012 -DGATELINT_POST_SYNTH=1 -s tb \
            -o "$work/post-synth.vvp" \
            "$yosys_data/ice40/cells_sim.v" \
            "$work/generic-synth.v" \
            "$root/sim/tb.sv" \
            > "$work/post-synth-compile.stdout" 2> "$work/post-synth-compile.stderr"
          vvp "$work/post-synth.vvp" \
            > "$work/post-synth.stdout" 2> "$work/post-synth.stderr"
          grep -q GATELINT_SIM_PASS "$work/post-synth.stdout"

          cat > "$work/equivalence.ys" <<YOSYS
          read_verilog -sv "$work/vhdl_counter.v" "$root/rtl/uart_challenge.sv" "$root/rtl/top.v"
          hierarchy -check -top top
          equiv_opt -assert -map +/ice40/cells_sim.v synth_ice40 -device u -top top
          YOSYS
          yosys -s "$work/equivalence.ys" \
            > "$work/equivalence.stdout" 2> "$work/equivalence.stderr"

          nextpnr-ice40 --up5k --package sg48 \
            --json "$work/ice40-synth.json" \
            --pcf "$root/constraints/icebreaker.pcf" \
            --asc "$work/routed.asc" --freq 12 --seed 1 \
            > "$work/nextpnr.stdout" 2> "$work/nextpnr.stderr"
          test -s "$work/routed.asc"
          if grep -Eqi 'unconstrained[^[:alnum:]]*(io|port)' "$work/nextpnr.stdout" "$work/nextpnr.stderr"; then
            echo 'nextpnr reported unconstrained I/O' >&2
            exit 1
          fi
          grep -Eqi 'Max frequency for clock.*12\.00 MHz' "$work/nextpnr.stdout" "$work/nextpnr.stderr"

          icetime -d up5k -P sg48 -p "$root/constraints/icebreaker.pcf" \
            -m -t -r "$work/icetime.txt" "$work/routed.asc" \
            > "$work/icetime.stdout" 2> "$work/icetime.stderr"
          test -s "$work/icetime.txt"
          python3 - "$work/icetime.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          match = re.search(r'Timing estimate:\s*([0-9.]+)\s*ns\s*\(([0-9.]+)\s*MHz\)', text, re.I)
          if not match:
              raise SystemExit('no parseable IceTime timing estimate')
          if float(match.group(2)) < 12.0:
              raise SystemExit(f'IceTime failed target: {match.group(2)} MHz')
          PY

          icepack "$work/routed.asc" "$work/gatelint.bin"
          iceunpack "$work/gatelint.bin" "$work/roundtrip.asc"
          test -s "$work/gatelint.bin"
          test -s "$work/roundtrip.asc"
          sed -E '/^[[:space:]]*($|#|\.comment|\.sym)/d; s/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
            "$work/routed.asc" > "$work/routed.canonical.asc"
          sed -E '/^[[:space:]]*($|#|\.comment|\.sym)/d; s/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' \
            "$work/roundtrip.asc" > "$work/roundtrip.canonical.asc"
          cmp "$work/routed.canonical.asc" "$work/roundtrip.canonical.asc"
          CORE
          chmod +x "$work/core.sh"

          start_ns=$(date +%s%N)
          timeout --signal=TERM --kill-after=5s 60s "$work/core.sh" "$root" "$work"
          end_ns=$(date +%s%N)

          python3 - "$work" "$start_ns" "$end_ns" <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          work = Path(sys.argv[1])
          start_ns, end_ns = map(int, sys.argv[2:4])
          wall_ms = round((end_ns - start_ns) / 1_000_000, 3)
          if wall_ms > 60_000:
              raise SystemExit(f'core flow exceeded 60 seconds: {wall_ms} ms')
          timing = (work / 'icetime.txt').read_text(encoding='utf-8', errors='replace')
          estimate = re.search(r'Timing estimate:\s*([0-9.]+)\s*ns\s*\(([0-9.]+)\s*MHz\)', timing, re.I)
          nextpnr = (work / 'nextpnr.stderr').read_text(encoding='utf-8', errors='replace') + '\n' + (work / 'nextpnr.stdout').read_text(encoding='utf-8', errors='replace')
          clocks = re.findall(r'Max frequency for clock[^:]*:\s*([0-9.]+)\s*MHz\s*\(PASS at\s*([0-9.]+)\s*MHz\)', nextpnr, re.I)
          artifacts = {}
          for path in sorted(work.iterdir()):
              if path.is_file() and path.name not in {'summary.json'}:
                  artifacts[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          tools = {}
          for name in ['ghdl','iverilog','yosys','nextpnr-ice40','icetime','icepack','iceunpack']:
              command = [name, '--version']
              if name in {'icetime','icepack','iceunpack'}:
                  command = [name, '-h']
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
              tools[name] = (result.stdout.splitlines() or ['unknown'])[0].strip()
          summary = {
              'schemaVersion': 1,
              'kind': 'gatelint-real-fpga-core-proof',
              'status': 'pass',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'externalWallMs': wall_ms,
              'deadlineMs': 60000,
              'underDeadline': True,
              'languages': ['vhdl','systemverilog','verilog'],
              'board': 'icebreaker',
              'device': 'iCE40UP5K-SG48',
              'clockTargetMHz': 12.0,
              'nextpnrClockResults': [{'maxMHz': float(a), 'targetMHz': float(b)} for a,b in clocks],
              'iceTimeDelayNS': float(estimate.group(1)),
              'iceTimeMaxMHz': float(estimate.group(2)),
              'behavioralSimulation': 'pass',
              'postSynthesisSimulation': 'pass',
              'logicalEquivalence': 'pass',
              'constraintClosure': 'pass',
              'placeRouteTiming': 'pass',
              'bitstreamRoundTrip': 'pass',
              'physicalBoardExecuted': False,
              'ossCadSuite': {'url': os.environ['OSS_CAD_URL'], 'sha256': os.environ['OSS_CAD_SHA256']},
              'tools': tools,
              'artifactSha256': artifacts,
          }
          (work / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatelint-real-fpga-core-${{ github.sha }}
          if-no-files-found: error
          path: test-results/gatelint-real-fpga-core/
