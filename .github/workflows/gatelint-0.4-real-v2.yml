name: gatelint-0.4-real-fpga-proof-v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/gatelint-0.4/**'
      - '.github/workflows/gatelint-0.4-real-v2.yml'

permissions:
  contents: read

concurrency:
  group: gatelint-0.4-real-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  icebreaker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OSS_CAD_ARCHIVE: oss-cad-suite-linux-x64-20260826.tgz
      OSS_CAD_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-26/oss-cad-suite-linux-x64-20260826.tgz
      OSS_CAD_SHA256: b9c1f7a53a8b144be8ab7f8fd754b98b0d2b1a0b72d39165f7bb2bf104b2b652
      SOURCE_SHA256: 042d164c287fd9e9b6664858a84cea967feafdb215f2062b5b3a76201feb7a8c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gatelint-source.tar.xz"
          cat "$GITHUB_WORKSPACE"/ci/gatelint-0.4/source.b64.part-* | base64 -d > "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gatelint-src"
          tar -xJf "$archive" -C "$RUNNER_TEMP/gatelint-src"
          test -f "$RUNNER_TEMP/gatelint-src/gatelint-0.4.0/go.mod"

      - name: cache pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.OSS_CAD_ARCHIVE }}
          key: oss-cad-suite-linux-x64-20260826-${{ env.OSS_CAD_SHA256 }}

      - name: download and verify pinned OSS CAD Suite
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$OSS_CAD_ARCHIVE"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 5 --retry-all-errors --output "$archive" "$OSS_CAD_URL"
          fi
          printf '%s  %s\n' "$OSS_CAD_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          for tool in ghdl iverilog vvp yosys nextpnr-ice40 icetime icepack iceunpack; do
            test -x "$RUNNER_TEMP/oss-cad-suite/bin/$tool"
          done

      - name: run tests and real mixed-language proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          root="$RUNNER_TEMP/gatelint-src/gatelint-0.4.0"
          cd "$root"
          go test ./...
          mkdir -p .gatelint/bin test-results/fpga-real
          go build -trimpath -buildvcs=false -o .gatelint/bin/gatelint ./cmd/gatelint
          project="$root/.gatelint/fpga-real-project"
          .gatelint/bin/gatelint fpga selftest --dir "$project" --force --scaffold-only
          .gatelint/bin/gatelint fpga doctor --config "$project/gatelint.json" --format json > test-results/fpga-real/doctor.json
          start_ns=$(date +%s%N)
          timeout --signal=TERM --kill-after=5s 70s .gatelint/bin/gatelint fpga prove \
            --config "$project/gatelint.json" --timeout 60s --format json \
            --output test-results/fpga-real/report.json --show-output
          end_ns=$(date +%s%N)
          python3 - "$root" "$project" "$start_ns" "$end_ns" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root, project = Path(sys.argv[1]), Path(sys.argv[2])
          start_ns, end_ns = int(sys.argv[3]), int(sys.argv[4])
          out = root / 'test-results/fpga-real'
          report = json.loads((out / 'report.json').read_text())
          doctor = json.loads((out / 'doctor.json').read_text())
          assert doctor['schemaVersion'] == 3 and doctor['ok'] is True, doctor
          assert report['schemaVersion'] == 3 and report['kind'] == 'fpga-proof'
          assert report['status'] == 'pass' and report['underDeadline'] is True, report
          assert 0 <= report['durationMs'] <= 60000
          assert report['languages'] == ['vhdl', 'systemverilog', 'verilog']
          assert set(report['requiredLanguages']) == {'vhdl', 'systemverilog', 'verilog'}
          assert report['board']['id'] == 'icebreaker'
          assert report['board']['yosysDevice'] == 'u'
          assert report['board']['uartRxPin'] == '6' and report['board']['uartTxPin'] == '9'
          assert doctor['constraintCount'] == 4
          assert report['clockPort'] == 'CLK' and report['clockTargetMHz'] == 12
          assert report['clockMaxMHz'] >= report['clockTargetMHz']
          assert not report['programRequested'] and not report['programmed']
          assert not report['hardwareVerified'] and not report['hardwareFresh']
          stages = {x['id']: x for x in report['stages']}
          core = ['preflight','vhdl','simulate','synth','constraints','simulate-synth','lvs','drc','timing','pack','roundtrip']
          assert all(stages[x]['status'] == 'pass' for x in core), stages
          assert stages['program']['status'] == 'skipped'
          assert stages['hardware']['status'] == 'skipped'
          for key, rel in report['artifacts'].items():
            if key == 'proofReport' or key not in report['artifactSha256']:
              continue
            p = Path(rel)
            if not p.is_absolute(): p = project / p
            assert hashlib.sha256(p.read_bytes()).hexdigest() == report['artifactSha256'][key]
          provenance = {
            'schemaVersion': 3,
            'kind': 'gatelint-real-fpga-toolchain-proof',
            'status': 'pass',
            'ossCadSuite': {'url': os.environ['OSS_CAD_URL'], 'sha256': os.environ['OSS_CAD_SHA256']},
            'sourceSha256': os.environ['SOURCE_SHA256'],
            'externalWallMs': round((end_ns-start_ns)/1_000_000, 3),
            'reportedWallMs': report['durationMs'],
            'languages': report['languages'],
            'clockTargetMHz': report['clockTargetMHz'],
            'clockMaxMHz': report['clockMaxMHz'],
            'coreStages': core,
            'tools': doctor['tools'],
            'physicalBoardExecuted': False,
          }
          (out / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          print(json.dumps(provenance, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatelint-0.4-real-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gatelint-src/gatelint-0.4.0/test-results/fpga-real/
            ${{ runner.temp }}/gatelint-src/gatelint-0.4.0/.gatelint/fpga-real-project/.gatelint/fpga/
